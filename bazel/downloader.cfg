# Bazel downloader configuration (--downloader_config).
#
# Some BCR modules only list third-party kernel.org mirrors that can be
# unreachable from some networks. Keep the original URL and add the canonical
# kernel.org CDN as an alternative.
rewrite (mirrors\.mit\.edu/kernel/.*) $1
rewrite mirrors\.mit\.edu/kernel/(.*) cdn.kernel.org/pub/$1
