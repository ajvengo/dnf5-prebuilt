name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Cancel previous runs of the same PR or branch, except on main.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}${{ github.ref_name == 'main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  e2e:
    # Runs e2e/smoke_test, which consumes the public API (dnf5-prebuilt/) like
    # a user would, against the archives built above on every platform.
    name: e2e (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux_amd64 }
          - { os: ubuntu-24.04-arm, platform: linux_arm64 }
          - { os: macos-15-intel, platform: osx_amd64 }
          - { os: macos-15, platform: osx_arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dnf5-${{ matrix.platform }}
          path: dist
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Smoke test
        working-directory: e2e/smoke_test
        run: >
          bazel --bazelrc=../../.github/workflows/ci.bazelrc test //...
          --repo_env=DNF5_PREBUILT_DIST_DIR=${{ github.workspace }}/dist

  buildifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Starlark formatting
        run: |
          curl -sfL -o /usr/local/bin/buildifier \
            https://github.com/bazelbuild/buildtools/releases/download/v8.5.1/buildifier-linux-amd64
          chmod +x /usr/local/bin/buildifier
          # Committed registry modules are immutable, so they are not checked.
          git ls-files '*.bazel' '*.bzl' | grep -v '^bazel/3rdparty/modules/' | xargs buildifier -mode=check -lint=warn
