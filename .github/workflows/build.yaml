# Builds the dnf5 distribution archive of every supported platform.
# Reused by ci.yaml and release.yml.
name: Build

on:
  workflow_call:
    secrets:
      BUILDBUDDY_ENDPOINT:
        description: BuildBuddy host name (gRPC at grpcs://<host>, invocations at https://<host>/invocation/)
        required: false
      BUILDBUDDY_API_KEY:
        required: false

jobs:
  build:
    # One job cross-compiles every platform with the hermetic LLVM toolchain,
    # so the platforms share the Bazel server, exec tools and caches.
    runs-on: ubuntu-24.04
    env:
      BUILDBUDDY_ENDPOINT: ${{ secrets.BUILDBUDDY_ENDPOINT }}
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      PLATFORMS: linux_amd64 linux_arm64 osx_amd64 osx_arm64
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ env.BUILDBUDDY_ENDPOINT == '' || env.BUILDBUDDY_API_KEY == '' }}
      - name: Configure remote cache
        if: env.BUILDBUDDY_ENDPOINT != '' && env.BUILDBUDDY_API_KEY != ''
        run: |
          {
            echo "common --config=buildbuddy"
            echo "common:buildbuddy --bes_backend=grpcs://${BUILDBUDDY_ENDPOINT}"
            echo "common:buildbuddy --bes_results_url=https://${BUILDBUDDY_ENDPOINT}/invocation/"
            echo "common:buildbuddy --remote_cache=grpcs://${BUILDBUDDY_ENDPOINT}"
            echo "common:buildbuddy-rbe --remote_executor=grpcs://${BUILDBUDDY_ENDPOINT}"
            echo "common:buildbuddy --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"
          } > .bazelrc.user
      - name: Test
        run: >
          bazel --bazelrc=.github/workflows/ci.bazelrc test
          --config=linux_amd64 -c opt //bazel/tests/...
      - name: Build
        run: |
          version=$(sed -n 's/^DNF5_VERSION = "\(.*\)"/\1/p' bazel/extensions.bzl)
          mkdir -p dist
          for platform in $PLATFORMS; do
            echo "::group::${platform}"
            bazel --bazelrc=.github/workflows/ci.bazelrc build \
              --config="${platform}" -c opt //bazel/release:dnf5 //bazel/tests/...
            # bazel-bin points at the configuration of the last build.
            cp -L bazel-bin/bazel/release/dnf5.tar.gz "dist/dnf5-${version}-${platform}.tar.gz"
            echo "::endgroup::"
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dnf5
          path: dist/*.tar.gz
          if-no-files-found: error
